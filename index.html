<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa Mental Executivo</title>
<meta name="theme-color" content="#07142b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mapa Mental">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b2347'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#07142b; --bg2:#0b2347; --bg3:#12376a;
  --ink:#eaf2ff; --mut:#8fa8cc; --line:rgba(130,180,255,.18);
  --glass:rgba(20,48,92,.55); --cy:#5bc4f0; --pc:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg1);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif}
body{min-height:100vh;background:
  radial-gradient(1200px 600px at 80% -10%,rgba(91,196,240,.18),transparent 60%),
  radial-gradient(900px 600px at -10% 30%,rgba(124,92,255,.14),transparent 60%),
  linear-gradient(180deg,var(--bg2),var(--bg1) 70%);
  background-attachment:fixed;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%)}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:18px 16px 40px}

/* header */
.hero{display:flex;gap:clamp(10px,3vw,16px);align-items:center;padding:6px 2px 14px}
.hero svg.logo{width:clamp(84px,24vw,104px);flex:none;filter:drop-shadow(0 0 10px rgba(91,196,240,.45))}
.hero h1{margin:0;font-family:'Orbitron',sans-serif;font-size:clamp(16px,4.6vw,26px);letter-spacing:.04em;line-height:1.15;
  background:linear-gradient(90deg,#fff,#9fdcff 60%,#b79bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .who{margin-top:5px;font-weight:600;color:var(--cy);font-size:clamp(10px,3.1vw,16px);white-space:nowrap}
.hero .who i{color:var(--mut);font-style:normal;margin:0 4px}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:4px 0 12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:8px 12px;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.kpi b{display:block;font-size:clamp(17px,4.6vw,22px);font-weight:800;letter-spacing:-.01em;color:#fff;text-shadow:0 0 5px #fff,0 0 14px #9fe6ff,0 0 26px rgba(91,196,240,.75)}
.kpi span{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2fe07a;margin-right:8px;box-shadow:0 0 10px #2fe07a;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}

/* tabs */
.tabs{display:inline-flex;padding:4px;border-radius:999px;background:rgba(10,30,62,.8);border:1px solid var(--line);margin:2px 0 10px}
.tabs button{border:0;background:none;color:var(--mut);font:600 13px 'Space Grotesk';padding:9px 18px;border-radius:999px;cursor:pointer;letter-spacing:.04em}
.tabs button.on{background:linear-gradient(135deg,#2a6df0,#5bc4f0);color:#fff;box-shadow:0 4px 18px rgba(60,140,255,.45)}

/* MAP */
#map{position:relative;width:100%;border-radius:28px;border:1px solid var(--line);
  background:radial-gradient(circle at 50% 50%,rgba(60,120,220,.22),rgba(7,20,43,.2) 62%);overflow:hidden}
#map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.flow{stroke-dasharray:3 7;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.orbit{fill:none;stroke:rgba(130,180,255,.14);stroke-dasharray:2 8}
.hub{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center;cursor:pointer;border:0;color:#fff;
  background:radial-gradient(circle at 35% 30%,rgba(74,168,255,.75),rgba(27,79,196,.7) 60%,rgba(12,42,107,.8));backdrop-filter:blur(3px);
  box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 0 40px rgba(70,150,255,.6),0 0 90px rgba(70,150,255,.3);z-index:3;font-family:'Space Grotesk'}
.brain{position:absolute;left:50%;top:50%;translate:-50% -50%;pointer-events:none;z-index:0;
  filter:drop-shadow(0 0 14px rgba(91,196,240,.45));animation:think 6s ease-in-out infinite}
#map .brain svg{position:static;inset:auto;width:100%;height:100%}
@keyframes think{50%{opacity:.78;scale:1.025}}
.brain{opacity:1}
.lg{position:absolute;z-index:4;pointer-events:none;display:grid;place-items:center;background:#fff;border-radius:6px;padding:2px 3px;
  box-shadow:0 3px 10px rgba(0,0,0,.5),0 0 10px color-mix(in srgb,var(--c) 60%,transparent);animation:float 6s ease-in-out infinite}
.lg img{display:block;max-width:100%;max-height:100%;object-fit:contain;border-radius:3px}
.card .lg2,.sh-head .lg2{background:#fff;border-radius:10px;padding:3px 7px;display:inline-block;margin-bottom:8px}
.lg2 img{display:block;height:24px;max-width:90px;object-fit:contain}
.hub::after,.hub::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(91,196,240,.5);animation:ring 3.2s ease-out infinite}
.hub::after{animation-delay:1.6s}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.7);opacity:0}}
.hub{padding:0;line-height:1}
.hub .hp{position:absolute;inset:3px;border-radius:50%;overflow:hidden;display:block;width:auto}
.hub .hp img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.hub .hn{position:absolute;left:0;right:0;bottom:0;padding:14px 0 2px;text-align:center;font:700 9px 'Space Grotesk',sans-serif;letter-spacing:.1em;color:#fff;
  background:linear-gradient(transparent,rgba(4,14,34,.92) 70%);text-shadow:0 0 6px #9fe6ff}
.hub{box-shadow:0 0 0 2px rgba(159,230,255,.85) inset,0 0 30px rgba(91,196,240,.75),0 0 70px rgba(91,196,240,.35)!important;background:#0b2347!important}
.hub>span{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;text-align:center}
.hub b{display:block;font-size:10.5px;line-height:1;letter-spacing:.04em;padding-left:.04em}
.hub small{display:block;font-size:7.5px;opacity:.85;margin-top:3px;letter-spacing:.08em;padding-left:.08em}

.node{position:absolute;border:0;border-radius:50%;cursor:pointer;color:#fff;display:grid;place-items:center;text-align:center;z-index:2;
  font-family:'Space Grotesk',sans-serif;padding:0;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.16),rgba(14,36,74,.88) 62%);
  box-shadow:0 0 22px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 22%,transparent);
  transition:transform .25s cubic-bezier(.2,.9,.3,1.4),box-shadow .25s;animation:float 6s ease-in-out infinite}
.node::before{content:'';position:absolute;inset:0;border-radius:50%;padding:3.5px;
  background:conic-gradient(from -90deg,var(--c) var(--a),rgba(255,255,255,.13) 0);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.node:hover,.node:focus-visible{transform:scale(1.12);z-index:5;outline:none;box-shadow:0 0 38px var(--c),inset 0 0 20px color-mix(in srgb,var(--c) 40%,transparent)}
@keyframes float{50%{translate:0 -5px}}
.node .nm{display:block;font-weight:600;line-height:1.05;padding:0 6px}
.node .pc{display:block;font-weight:800;margin-top:2px;color:#fff;text-shadow:0 0 5px #fff,0 0 14px #9fe6ff,0 0 26px rgba(91,196,240,.8)}

/* CARDS */
#cards{display:none;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){#cards{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;text-align:left;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:22px;padding:16px 16px 14px;cursor:pointer;color:var(--ink);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,rgba(14,36,74,.9)),rgba(10,28,58,.92) 70%);
  box-shadow:0 8px 30px color-mix(in srgb,var(--c) 18%,transparent);transition:transform .2s,box-shadow .2s;overflow:hidden;font-family:inherit;min-height:112px}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 36px color-mix(in srgb,var(--c) 40%,transparent)}
.card.big{grid-column:span 2;min-height:130px}
.card .nm{font-weight:600;font-size:clamp(14px,3.8vw,17px)}
.card .pc{font-family:'Orbitron';font-weight:700;font-size:clamp(24px,7vw,34px);color:#fff;margin-top:6px;text-shadow:0 0 5px #fff,0 0 16px #9fe6ff,0 0 28px rgba(91,196,240,.7)}
.card .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--c);box-shadow:0 0 12px var(--c);border-radius:0 4px 0 0}

/* distribution */
.dist{margin-top:16px;padding:14px 16px;border-radius:20px;background:var(--glass);border:1px solid var(--line)}
.dist h3{margin:0 0 10px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:2px;background:rgba(255,255,255,.06)}
.stack i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 70%,transparent);cursor:pointer;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--mut)}
.legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
.foot{margin-top:14px;font-size:12px;color:var(--mut);text-align:center}

/* tooltip */
#tip{position:fixed;z-index:60;max-width:300px;padding:14px 15px;border-radius:16px;pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s;
  background:rgba(8,22,48,.96);border:1px solid color-mix(in srgb,var(--c,#5bc4f0) 60%,transparent);backdrop-filter:blur(10px);
  box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 28px color-mix(in srgb,var(--c,#5bc4f0) 30%,transparent)}
#tip.on{opacity:1;transform:none}
#tip h4{margin:0 0 2px;font-size:15px}
#tip .sub{font-size:11.5px;color:var(--c);font-weight:600;margin-bottom:8px}
#tip p{margin:0 0 9px;font-size:12.5px;line-height:1.4;color:#cfe0fb}
#tip .cnt{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}
#tip .cnt b{color:#fff}
#tip .nx{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:#cfe0fb}
#tip .nx em{font-style:normal;color:var(--c);font-weight:600}

/* sheet */
#ov{position:fixed;inset:0;background:rgba(2,8,20,.62);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:70}
#ov.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:80;background:linear-gradient(180deg,#0e2650,#081a3a);border:1px solid var(--line);color:var(--ink);
  left:0;right:0;bottom:0;height:90vh;border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);
  display:flex;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.6)}
#sheet.on{transform:none}
@media(min-width:900px){#sheet{left:auto;top:0;width:500px;height:100vh;border-radius:28px 0 0 28px;transform:translateX(105%)}#sheet.on{transform:none}}
.sh-head{padding:18px 18px 14px;border-bottom:1px solid var(--line);position:relative;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 28%,transparent),transparent 70%);border-radius:28px 28px 0 0}
.sh-x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font-size:18px;cursor:pointer}
.sh-head h2{margin:0;font-size:24px;padding-right:44px}
.badge{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini div{padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.mini b{display:block;font-size:16px;color:var(--c)}
.mini span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.sh-body{overflow:auto;padding:14px 16px 40px;flex:1;-webkit-overflow-scrolling:touch}
.resumo{font-size:13.5px;line-height:1.5;color:#cfe0fb;margin:0 0 6px}
.sec{margin-top:16px}
.sec h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--c);font-weight:700}
.sec h3 em{font-style:normal;margin-left:auto;color:var(--mut);font-weight:500}
.it{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin-bottom:6px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:13.5px;line-height:1.4}
.it .tx{flex:1}
.it.dn .tx{text-decoration:line-through;opacity:.5}
.pr{flex:none;font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:99px;margin-top:1px}
.p1{background:rgba(255,90,130,.18);color:#ff7fa3;border:1px solid rgba(255,90,130,.45)}
.p2{background:rgba(255,196,70,.15);color:#ffd070;border:1px solid rgba(255,196,70,.4)}
.p3{background:rgba(91,196,240,.14);color:#7fd3f5;border:1px solid rgba(91,196,240,.4)}
.ck{flex:none;width:20px;height:20px;border-radius:7px;border:1.5px solid var(--c);background:none;color:#fff;cursor:pointer;display:grid;place-items:center;font-size:12px;margin-top:1px;padding:0}
.dn .ck{background:var(--c)}
.rm{flex:none;border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;padding:0 2px}
.empty{font-size:12.5px;color:var(--mut);padding:8px 2px;font-style:italic}
.add{margin-top:2px;border:1px dashed color-mix(in srgb,var(--c) 55%,transparent);background:none;color:var(--c);border-radius:12px;padding:8px 12px;font:600 12.5px 'Space Grotesk';cursor:pointer;width:100%}
.addf{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.addf input{flex:1 1 150px;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font:14px 'Space Grotesk'}
.addf select,.addf button{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.09);color:#fff;font:600 13px 'Space Grotesk'}
.addf button.ok{background:var(--c);color:#04112b;border-color:transparent}
.note{margin-top:18px;font-size:11.5px;color:var(--mut);line-height:1.5}
.bars{display:flex;align-items:flex-end;gap:6px;height:70px;padding:6px 2px}
.bars div{flex:1;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 30%,transparent));border-radius:6px 6px 2px 2px;position:relative}
.bars span{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--mut)}
#map::before{content:'';position:absolute;inset:-50%;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1.5px 1.5px at 20px 30px,#cfeaff,transparent),radial-gradient(1px 1px at 90px 120px,#9fdcff,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#c9a2ff,transparent),radial-gradient(1px 1px at 230px 170px,#fff,transparent);
  background-size:260px 200px;animation:drift 60s linear infinite}
@keyframes drift{to{transform:translate3d(-260px,-200px,0)}}
.aura{position:absolute;left:50%;top:50%;translate:-50% -50%;border-radius:50%;pointer-events:none;z-index:0;filter:blur(34px);opacity:.9;
  background:conic-gradient(from 0deg,rgba(91,196,240,0),rgba(91,196,240,.22),rgba(154,123,255,.22),rgba(91,196,240,0) 70%);animation:spin 20s linear infinite}
@keyframes spin{to{rotate:360deg}}
.sy{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
.sy:nth-child(2){animation-delay:-.5s}.sy:nth-child(3){animation-delay:-1.1s}.sy:nth-child(4){animation-delay:-1.7s}.sy:nth-child(5){animation-delay:-2.2s}.sy:nth-child(6){animation-delay:-2.7s}
@keyframes tw{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(2)}}
.orbit{animation:dash 6s linear infinite}
.tr{position:absolute;z-index:4;pointer-events:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#04112b;box-shadow:0 0 12px currentColor}
.tr.up{background:#3dffa8}.tr.dn{background:#ffd84a}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 10px}
.bar .tabs{margin:0}
.ideas-btn{border:1px solid rgba(255,230,120,.5);background:linear-gradient(135deg,rgba(255,214,90,.2),rgba(185,140,255,.18));color:#fff;border-radius:999px;padding:9px 16px;font:600 13px 'Space Grotesk';cursor:pointer;
  box-shadow:0 0 22px rgba(255,214,90,.28);letter-spacing:.02em}
.ideas-btn b{margin-left:6px;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.16);font-size:12px}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-size:12px;color:var(--mut)}
.key span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);margin-right:7px}
.srch{width:100%;margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font:14px 'Space Grotesk'}
.fl{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.fl select{flex:1 1 140px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:#0c2147;color:#fff;font:13px 'Space Grotesk'}
.seg{display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.seg button{border:0;background:rgba(255,255,255,.06);color:var(--mut);padding:9px 12px;font:600 12px 'Space Grotesk';cursor:pointer}
.seg button.on{background:#5bc4f0;color:#04112b}
.grp{margin:18px 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;display:flex;gap:8px;align-items:center}
.grp em{font-style:normal;color:var(--mut);font-weight:500;margin-left:auto}
.g1{color:#ff7fa3}.g2{color:#ffd070}.g3{color:#7fd3f5}.g0{color:#3dffa8}
.th{display:flex;gap:10px;padding:11px 12px;margin-bottom:6px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer;font-size:13.5px;line-height:1.4}
.th:hover{background:rgba(255,255,255,.1)}
.th .mk{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;font-size:13px;margin-top:1px}
.th.d .mk{border-color:#3dffa8;color:#3dffa8;box-shadow:0 0 10px rgba(61,255,168,.5)}
.th.d .tx{opacity:.6}
.th .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.th .meta i{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.th .cl{background:rgba(127,220,255,.16);color:#9fe3ff}.th .ty{background:rgba(185,140,255,.16);color:#cdb0ff}
.hd{display:flex;gap:10px;align-items:flex-start}
.hd-l{flex:1;min-width:0}
.hd-r{flex:none;margin-top:34px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.vr{text-align:right}
.vr span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.vr b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:1px}
.vr .up{color:#3dffa8;text-shadow:0 0 12px rgba(61,255,168,.65)}
.vr .dn{color:#ffd84a;text-shadow:0 0 12px rgba(255,216,74,.55)}
.avg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ac{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.ac small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ac b{display:block;font-size:16px;margin-top:5px;color:#fff;text-shadow:0 0 10px rgba(159,230,255,.5)}
.ac em{font-style:normal;font-size:10.5px;color:var(--cy);margin-right:5px;font-weight:600}
.ac i{display:block;font-style:normal;font-size:12px;color:var(--mut);margin-top:4px}
.back{border:0;background:none;color:#9fe3ff;font:600 12.5px 'Space Grotesk';cursor:pointer;padding:0 0 8px}
.mic{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.09);color:#fff;border-radius:12px;padding:10px 13px;font-size:16px;cursor:pointer}
.mic.rec{background:#ff4d6d;box-shadow:0 0 18px #ff4d6d;animation:pulse 1s infinite}
.capb{margin-top:10px;border:1px dashed rgba(255,214,90,.6);background:rgba(255,214,90,.08);color:#ffd65a;border-radius:12px;padding:9px 14px;font:600 13px 'Space Grotesk';cursor:pointer;width:100%}
.cap{padding:12px;margin-bottom:12px;border-radius:16px;background:rgba(255,214,90,.07);border:1px solid rgba(255,214,90,.35)}
.cap textarea{width:100%;min-height:76px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font:14px 'Space Grotesk';resize:vertical}
.cap .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cap select{flex:1 1 110px;padding:10px;border-radius:12px;border:1px solid var(--line);background:#0c2147;color:#fff;font:13px 'Space Grotesk'}
.cap .ok{flex:1 1 100%;padding:11px;border:0;border-radius:12px;background:#ffd65a;color:#04112b;font:700 14px 'Space Grotesk';cursor:pointer}
.bkp{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.bkp button,.bkp label{flex:1 1 140px;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#cfe0fb;font:600 12.5px 'Space Grotesk';cursor:pointer}
.th .dt{background:rgba(255,255,255,.08);color:var(--mut)}
.th .mk[data-tg]{cursor:pointer}
.act{display:flex;flex-direction:column;gap:4px;flex:none}
.act button{border:0;background:rgba(255,255,255,.09);color:#cfe0fb;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px}
.et{width:100%;min-height:64px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.09);color:#fff;font:14px 'Space Grotesk'}
.erow{display:flex;gap:6px;margin-top:6px}
.erow button{flex:1;padding:8px;border-radius:10px;border:0;font:600 13px 'Space Grotesk';cursor:pointer;background:rgba(255,255,255,.1);color:#fff}
.erow .sv{background:#ffd65a;color:#04112b}
#fab{position:fixed;right:16px;bottom:18px;z-index:55;width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;font-size:26px;
  background:linear-gradient(135deg,#ffd65a,#ff9d4d);box-shadow:0 0 0 4px rgba(255,214,90,.18),0 8px 28px rgba(255,170,60,.55)}
#intro{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,#0f2f66,#06122a 62%,#030a18);transition:opacity .7s ease,transform .7s ease}
#intro.out{opacity:0;transform:scale(1.18);pointer-events:none}
#intro::before{content:'';position:absolute;inset:0;opacity:.45;background-image:linear-gradient(rgba(130,180,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(130,180,255,.16) 1px,transparent 1px);background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 45%,#000 5%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 5%,transparent 70%)}
#isv{position:relative;width:min(80vw,440px);overflow:visible;filter:drop-shadow(0 0 16px rgba(91,196,240,.55))}
#isv.fire{animation:ifire 1s ease-out}
@keyframes ifire{0%{filter:brightness(1) drop-shadow(0 0 16px rgba(91,196,240,.55));transform:scale(1)}25%{filter:brightness(2.4) drop-shadow(0 0 60px rgba(180,220,255,1));transform:scale(1.06)}100%{filter:brightness(1.15) drop-shadow(0 0 26px rgba(91,196,240,.7));transform:scale(1)}}
.io{stroke-dasharray:1;stroke-dashoffset:1}
#irip{position:absolute;width:40px;height:40px;border-radius:50%;border:2px solid #9fe6ff;opacity:0;pointer-events:none}
#irip.go{animation:iripple 1.2s ease-out}
@keyframes iripple{from{transform:translate(-50%,-50%) scale(1);opacity:.95}to{transform:translate(-50%,-50%) scale(26);opacity:0}}
#iw{position:relative;height:44px;margin-top:22px;font:700 clamp(18px,5.6vw,30px) 'Orbitron','Space Grotesk',sans-serif;letter-spacing:.26em;padding-left:.26em;text-transform:uppercase;color:#fff;white-space:nowrap;
  text-shadow:0 0 6px #fff,0 0 18px #9fe6ff,0 0 38px rgba(91,196,240,.9)}
#iw.pop{animation:wpop .75s ease-out forwards}
#iw.fin{font-size:clamp(15px,4.6vw,24px);letter-spacing:.2em;padding-left:.2em;animation:wfin .8s ease-out both}
@keyframes wpop{0%{opacity:0;transform:translateY(10px) scale(.88);filter:blur(7px)}28%{opacity:1;transform:none;filter:none}78%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@keyframes wfin{0%{opacity:0;transform:scale(.8);filter:blur(8px)}100%{opacity:1;transform:none;filter:none}}
#ibarw{position:relative;width:min(56vw,260px);height:3px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
#ibar{display:block;height:100%;width:0;background:linear-gradient(90deg,#5bc4f0,#fff,#b98cff);box-shadow:0 0 12px #9fe6ff}
#ipc{position:relative;margin-top:8px;font:600 11px 'Space Grotesk',sans-serif;letter-spacing:.2em;color:#8fb4e6}
#itap{position:absolute;bottom:12%;left:0;right:0;text-align:center;font:600 13px 'Space Grotesk',sans-serif;letter-spacing:.3em;color:#cfeaff;animation:pulse 1.4s infinite}
@media(prefers-reduced-motion:reduce){.node,.flow,.hub::before,.hub::after,.live,.aura,.sy,.orbit,#map::before,.brain{animation:none}}

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const nf = (v,d=1) => v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const money = v => v>=1 ? 'R$ '+nf(v, Number.isInteger(v)?0:(Math.round(v*100)%10===0?1:2))+' mi' : 'R$ '+Math.round(v*1000)+' mil';
/* Cor = situação do cliente (não mais uma cor por cliente).
   ok = plano bônus no caminho · risk = não fecha o plano · none = sem plano bônus */
const PLAN={scherer:'ok',roni:'ok',toli:'ok',pratense:'ok',giros:'ok',meridional:'risk',bodipasa:'risk',ravas:'none',climer:'none',refrijet:'none'};
const PCOL={ok:'#aee9ff',risk:'#ff4d6d',none:'#7f93b8'};
const PTXT={ok:'Plano bônus: no caminho',risk:'Plano bônus: não fecha',none:'Sem plano bônus'};
/* tendência (a preencher depois): {scherer:'up'} = crescendo (verde) · {giros:'dn'} = caindo (amarelo) */
const TREND={};
HUB.rank=99;
CLIENTS.forEach(c=>{c.plan=PLAN[c.id];c.c=PCOL[c.plan];});
const total = CLIENTS.reduce((a,c)=>a+c.fat,0);
CLIENTS.forEach((c,i)=>{c.pct=c.fat/total*100; c.rank=i+1;});
CLIENTS.sort((a,b)=>b.fat-a.fat).forEach((c,i)=>c.rank=i+1);
const byId = id => id==='hub'?HUB:CLIENTS.find(c=>c.id===id);

/* estado local (só neste aparelho): itens marcados e itens extras */
let L = {done:{}, extra:{}};
try{ const s=localStorage.getItem('mme-v1'); if(s) L=Object.assign(L,JSON.parse(s)); }catch(e){}
const save = () => { try{ localStorage.setItem('mme-v1', JSON.stringify(L)); }catch(e){} };

function items(c, k){
  const all=kk=>{
    const base=(c[kk]||[]).map((it,i)=>({...it, id:`${c.id}.${kk}.${i}`, ok:kk}));
    const ex=((L.extra[c.id]||{})[kk]||[]).filter(it=>(+String(it.id).slice(1)||0)>ABSORBED).map(it=>({...it, extra:true, ok:kk}));
    return base.concat(ex);
  };
  if(k==='andamento'||k==='pendencias') return all(k).filter(i=>!L.done[i.id]);
  if(k==='feito') return all('feito').concat(['andamento','pendencias'].flatMap(kk=>all(kk).filter(i=>L.done[i.id])
    .map(i=>({...i, reopen:true, d:(typeof L.done[i.id]==='string'?L.done[i.id]:i.d)}))));
  return all(k);
}
const open_ = (c,k) => items(c,k).filter(i=>!L.done[i.id]);
function tier(c){ return c.pct>=10?'Conta A · Estratégica':c.pct>=4?'Conta B · Importante':'Conta C · Em desenvolvimento'; }

/* ---------- KPIs ---------- */
function renderKpis(){
  const top3 = CLIENTS.slice(0,3).reduce((a,c)=>a+c.pct,0);
  const pend = CLIENTS.concat([HUB]).reduce((a,c)=>a+open_(c,'pendencias').length,0);
  const proj = CLIENTS.concat([HUB]).reduce((a,c)=>a+open_(c,'projetos').length,0);
  $('#kpis').innerHTML = [
    [money(total),'Sell in médio / mês'],
    [CLIENTS.length,'Clientes na carteira'],
    [nf(top3)+'%','Peso dos 3 maiores'],
    [pend+' · '+proj,'Pendências · Projetos']
  ].map(([b,s])=>`<div class="kpi"><b>${b}</b><span>${s}</span></div>`).join('');
  const ib=$('#ib b'); if(ib) ib.textContent=allThoughts().filter(x=>!x.done).length;
}

/* ---------- MAPA ---------- */
function renderMap(){
  const m=$('#map'); const W=m.clientWidth||360;
  const mob=W<700;
  const bw=Math.min(W*1.04,(mob?410:760)), bh=bw*.85;
  const s=mob?Math.min(W/390,1):Math.min(1.3,bw/540);
  const top0=mob?10:16, cx=W/2, cy=top0+bh/2;
  const dOf=c=>(46+Math.sqrt(c.pct)*6.2)*s;
  /* dentro do cérebro: clientes com plano bônus · fora: sem plano bônus */
  const inside=CLIENTS.filter(c=>c.plan!=='none'), outside=CLIENTS.filter(c=>c.plan==='none');
  const rxIn=bw*.31, ryIn=bh*.265, RF=[1.05,.97,.97,1,1,1,1];
  const pos=inside.map((c,i)=>{const a=(-90+i*360/inside.length)*Math.PI/180;
    return {c,x:cx+rxIn*RF[i]*Math.cos(a),y:cy+ryIn*RF[i]*Math.sin(a),d:dOf(c)};});
  const rv=outside.find(c=>c.id==='ravas'), others=outside.filter(c=>c.id!=='ravas');
  const dR=dOf(rv), gap=(mob?14:24)*s, oy=top0+bh+(mob?6:10)+dR/2-4;
  pos.push({c:rv,x:cx,y:oy,d:dR,out:1});
  const dL=dOf(others[0])*.85, dRt=dOf(others[1])*.85;
  pos.push({c:others[0],x:cx-dR/2-gap-dL/2,y:oy,d:dL,out:1});
  pos.push({c:others[1],x:cx+dR/2+gap+dRt/2,y:oy,d:dRt,out:1});
  const H=Math.round(oy+dR/2+(mob?36:48)); m.style.height=H+'px';
  const hd=(mob?72:96)*s;
  const bx=cx, by=top0+bh*.9;
  let svg=`<svg viewBox="0 0 ${W} ${H}"><defs><filter id="g"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <ellipse class="orbit" cx="${cx}" cy="${cy}" rx="${rxIn}" ry="${ryIn}"/>`;
  pos.forEach((p,i)=>{
    const w=(1.2+p.c.pct/38*2.6).toFixed(2), x0=p.out?bx:cx, y0=p.out?by:cy, op=p.out?.35:.7;
    svg+=`<path class="flow" d="M${x0},${y0} L${p.x},${p.y}" stroke="${p.c.c}" stroke-width="${p.out?1.4:w}" fill="none" opacity="${op}" filter="url(#g)"/>`;

const tip=$('#tip'); const canHover=matchMedia('(hover:hover)').matches;
function tipHtml(c){
  const n=k=>open_(c,k).length;
  const next=open_(c,'andamento').sort((a,b)=>(a.p||2)-(b.p||2))[0]||open_(c,'pendencias').sort((a,b)=>(a.p||2)-(b.p||2))[0];
  return `<h4>${esc(c.name)}</h4><div class="sub">${c.id==='hub'?'Fabio Garcia · visão geral':nf(c.pct)+'% da carteira · '+money(c.fat)+'/mês'}</div>

  ${next?`<div class="nx"><em>Foco agora:</em> ${esc(next.t)}</div>`:''}`;
}
function showTip(e,c){
  tip.style.setProperty('--c',c.c); tip.innerHTML=tipHtml(c); tip.classList.add('on');
  const w=tip.offsetWidth,h=tip.offsetHeight; let x=e.clientX+16,y=e.clientY+16;
  if(x+w>innerWidth-8)x=e.clientX-w-16; if(y+h>innerHeight-8)y=innerHeight-h-8;
  tip.style.left=Math.max(8,x)+'px'; tip.style.top=Math.max(8,y)+'px';
}
function bind(root){
  root.querySelectorAll('[data-id]').forEach(el=>{
    const c=byId(el.dataset.id);
    el.addEventListener('click',()=>{tip.classList.remove('on');openSheet(c.id);});
    if(canHover){
      el.addEventListener('mousemove',e=>showTip(e,c));
      el.addEventListener('mouseleave',()=>tip.classList.remove('on'));
    }
  });
}

function saveItem(k){
  const t=($('#ai').value||'').trim(); if(!t) return;
  const p=+$('#ap').value; L.extra[cur]=L.extra[cur]||{}; (L.extra[cur][k]=L.extra[cur][k]||[]).push({id:'x'+Date.now(),t,p});
  adding=null; save(); drawSheet(); refresh();
}
const refresh=()=>{renderKpis();};
/* ditado por voz (Chrome/Android/Safari, em site https) */
function mic(btn,input){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){btn.style.display='none';return;}
  let r=null,on=false;
  btn.onclick=()=>{
    if(on){r.stop();return;}
    r=new SR(); r.lang='pt-BR'; r.interimResults=true; r.continuous=true;
    const base=input.value?input.value+' ':'';
    r.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;input.value=base+t;};
    r.onend=r.onerror=()=>{on=false;btn.classList.remove('rec');};
    try{r.start();on=true;btn.classList.add('rec');}catch(e){}
  };
}

/* ---------- pensamentos e ideias ---------- */
let iq='', icl='all', ist='all', capOpen=false;
const TL={objetivos:'Objetivo',andamento:'Em andamento',pendencias:'Pendente',projetos:'Projeto',feito:'Feito',ideias:'Ideia',audios:'Áudio'};
function allThoughts(){
  const out=[];
  CLIENTS.concat([HUB]).forEach(c=>SECTIONS.forEach(S=>items(c,S.k).forEach(it=>{
    out.push({c,k:S.k,id:it.id,extra:!!it.extra,reopen:!!it.reopen,ok:it.ok||S.k,t:it.t,d:it.d,p:S.k==='feito'?0:(it.p||2),done:S.k==='feito'||!!L.done[it.id]});

}

  };

      a.href=URL.createObjectURL(b);a.download='mapa-mental-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();}catch(e){}

function fillIdeas(){
  const q=iq.toLowerCase().trim();
  const list=allThoughts().filter(x=>(icl==='all'||x.c.id===icl)&&(ist==='all'||(ist==='done')===x.done)&&(!q||(x.c.name+' '+TL[x.k]+' '+x.t).toLowerCase().includes(q)))
    .sort((a,b)=>a.c.rank-b.c.rank);
  const G=[[1,'Prioridade alta','g1'],[2,'Prioridade média','g2'],[3,'Prioridade baixa','g3']];
  let h='';
  const row=x=>`<div class="th ${x.done?'d':''}" data-c="${x.c.id}"><div class="mk" ${x.k==='feito'&&!x.reopen?'':`data-tg="${x.id}"`}>${x.done?'✔':''}</div><div style="flex:1;min-width:0"><div class="meta"><i class="cl">${esc(x.c.name)}</i><i class="ty">${TL[x.k]}</i>${x.d?`<i class="dt">${x.d}</i>`:''}</div><div class="tx">${esc(x.t)}</div></div>${x.extra?`<div class="act"><button data-ed="${x.id}" aria-label="Editar">✎</button><button data-dl="${x.id}" aria-label="Apagar">🗑</button></div>`:''}</div>`;
  G.forEach(([p,t,cl])=>{ const g=list.filter(x=>!x.done&&x.p===p); if(g.length) h+=`<div class="grp ${cl}">${t}<em>${g.length}</em></div>`+g.map(row).join(''); });
  const dn=list.filter(x=>x.done); if(dn.length) h+=`<div class="grp g0">✔ Concluído<em>${dn.length}</em></div>`+dn.map(row).join('');
  if(!list.length) h='<div class="empty" style="padding:24px 4px">Nenhum pensamento encontrado com esse filtro.</div>';
  $('#il').innerHTML=h;
  $('#icnt').textContent=list.length+' registro'+(list.length===1?'':'s');
  const il=$('#il'), find=id=>allThoughts().find(x=>x.id===id);
  il.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>openSheet(el.dataset.c,true));
  il.querySelectorAll('[data-tg]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.tg; if(L.done[id])delete L.done[id]; else L.done[id]=new Date().toLocaleDateString('pt-BR'); save(); fillIdeas(); refresh();});
  il.querySelectorAll('[data-dl]').forEach(b=>b.onclick=e=>{e.stopPropagation();const x=find(b.dataset.dl); if(!x)return;
    L.extra[x.c.id][x.ok]=L.extra[x.c.id][x.ok].filter(i=>i.id!==x.id); delete L.done[x.id]; save(); fillIdeas(); refresh();});
  il.querySelectorAll('[data-ed]').forEach(b=>b.onclick=e=>{e.stopPropagation();const x=find(b.dataset.ed); if(!x)return;
    const box=b.closest('.th').querySelector('.tx'); box.innerHTML=`<textarea class="et">${esc(x.t)}</textarea><div class="erow"><button class="sv">Salvar</button><button class="cn">Cancelar</button></div>`;
    box.onclick=ev=>ev.stopPropagation(); const ta=box.querySelector('textarea'); ta.focus();
    box.querySelector('.cn').onclick=()=>fillIdeas();
    box.querySelector('.sv').onclick=()=>{const t=ta.value.trim(); if(!t)return; const it=L.extra[x.c.id][x.ok].find(i=>i.id===x.id); if(it)it.t=t; save(); fillIdeas();};
  });
}
$('#ib').onclick=openIdeas;
$('#fab').onclick=()=>{capOpen=true; openIdeas(); const t=$('#ct'); if(t)t.focus();};
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}

/* ---------- abas e init ---------- */
function tab(v){ $('#tMap').classList.toggle('on',v==='map'); $('#tCards').classList.toggle('on',v==='cards');
  $('#map').style.display=v==='map'?'block':'none'; $('#cards').style.display=v==='cards'?'grid':'none'; if(v==='map')renderMap(); }
$('#tMap').onclick=()=>tab('map'); $('#tCards').onclick=()=>tab('cards');
renderKpis(); renderCards(); renderDist(); renderMap();
let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if($('#map').style.display!=='none')renderMap();},150);});
</script>

<script>
/* ---------- abertura: cérebro sendo ativado ---------- */
(function(){
  const intro=document.getElementById('intro'); if(!intro) return;
  const svg=document.getElementById('isv'), iw=document.getElementById('iw'), bar=document.getElementById('ibar'),
        pc=document.getElementById('ipc'), tap=document.getElementById('itap'), rip=document.getElementById('irip');
  const HEM="M200,40 C170,20 110,25 80,60 C45,70 25,110 40,145 C15,175 30,225 65,240 C70,280 120,305 160,290 C180,300 195,290 200,280 Z";
  const FOLDS=["M200,60 C170,50 140,65 135,90 C130,110 105,105 95,125","M60,100 C80,95 95,110 90,135 C85,160 60,150 55,175",
    "M200,120 C175,115 160,135 165,155 C170,175 145,180 135,200","M95,190 C115,185 125,205 115,225 C108,240 85,235 80,255",
    "M200,190 C185,195 175,215 185,235 C192,250 175,265 165,278","M130,140 C145,150 135,170 120,165"];
  const DOTS=[[135,90],[95,125],[165,155],[135,200],[115,225],[185,235],[55,175]];
  const mir=h=>h+'<g transform="translate(400 0) scale(-1 1)">'+h+'</g>';
  svg.innerHTML=`<defs>
    <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5bc4f0"/><stop offset="1" stop-color="#9a7bff"/></linearGradient>
    <linearGradient id="ifl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9a7bff" stop-opacity=".9"/><stop offset="1" stop-color="#5bc4f0" stop-opacity=".9"/></linearGradient>
    <clipPath id="icp"><rect id="irect" x="-10" y="312" width="420" height="360"/></clipPath></defs>
    ${mir(`<path class="io" pathLength="1" d="${HEM}" stroke="url(#ig)" stroke-width="2.6" stroke-linejoin="round"/>`+FOLDS.map(d=>`<path class="io" pathLength="1" d="${d}" stroke="url(#ig)" stroke-width="1.8" stroke-linecap="round"/>`).join(''))}
    <g clip-path="url(#icp)">${mir(`<path d="${HEM}" fill="url(#ifl)" fill-opacity=".62"/>`+FOLDS.map(d=>`<path d="${d}" stroke="#e6f8ff" stroke-opacity=".75" stroke-width="1.8" stroke-linecap="round"/>`).join(''))}</g>
    ${mir(DOTS.map(([x,y])=>`<circle class="idot" cx="${x}" cy="${y}" r="4" fill="#fff" opacity="0" style="transform-box:fill-box;transform-origin:center"/>`).join(''))}`;
  const outs=[...svg.querySelectorAll('.io')], dots=[...svg.querySelectorAll('.idot')], rect=svg.querySelector('#irect');
  const WORDS=[[300,'Data'],[1050,'Numbers'],[1800,'Thoughts'],[2450,'Ideas']];
  const IMPACT=3000, HOLD=2000;

  /* som: varredura que sobe, batidas por palavra e impacto com brilho */
  let AC=null, master=null;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  function sfx(){
    if(!AC) return;
    const c=AC, t=c.currentTime+.04, ti=t+IMPACT/1000;
    master=c.createGain(); master.gain.value=.52;
    const comp=c.createDynamicsCompressor(); comp.threshold.value=-20; comp.ratio.value=6; master.connect(comp); comp.connect(c.destination);
    // reverb sintético (cauda longa e escura)
    const rl=Math.floor(c.sampleRate*2.6), ir=c.createBuffer(2,rl,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch); for(let i=0;i<rl;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/rl,2.6);}
    const rv=c.createConvolver(); rv.buffer=ir; const rg=c.createGain(); rg.gain.value=.45; rv.connect(rg); rg.connect(master);
    const out=c.createGain(); out.connect(master); out.connect(rv);
    const env=(g,t0,peak,att,dec)=>{g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+att);g.gain.exponentialRampToValueAtTime(.0001,t0+att+dec);};
    const curve=k=>{const n=2048,a=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;a[i]=(3+k)*x*20*Math.PI/180/(Math.PI+k*Math.abs(x));}return a;};
    const noise=(len)=>{const nb=c.createBuffer(1,c.sampleRate*len,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return nb;};
    // 1) drone grave com segunda menor (E1 contra F1) e trítono: sensação de ameaça
    const dg=c.createGain(), dlp=c.createBiquadFilter(); dlp.type='lowpass'; dlp.Q.value=4;
    dlp.frequency.setValueAtTime(70,t); dlp.frequency.exponentialRampToValueAtTime(520,ti-.1);
    dg.gain.setValueAtTime(.0001,t); dg.gain.exponentialRampToValueAtTime(.2,ti-.12);
    dg.gain.exponentialRampToValueAtTime(.015,ti-.02);            // respiro antes do golpe
    dg.gain.exponentialRampToValueAtTime(.34,ti+.06);
    dg.gain.exponentialRampToValueAtTime(.0001,ti+2.4);
    [[30.87,'sawtooth'],[32.7,'sawtooth'],[43.65,'sawtooth'],[20.6,'sine'],[41.2,'sine']].forEach(([fr,ty],i)=>{
      const o=c.createOscillator(); o.type=ty; o.frequency.value=fr; o.detune.value=(i-1)*6;
      const og=c.createGain(); og.gain.value=i>=3?(i===3?2.0:1.2):(i===2?.45:1); o.connect(og); og.connect(dlp); o.start(t); o.stop(ti+2.5);
    });
    dlp.connect(dg); dg.connect(out);
    // 2) ruído que sobe (varredura) até o impacto
    const rn=c.createBufferSource(); rn.buffer=noise(4); const bp=c.createBiquadFilter(), rgn=c.createGain(); bp.type='bandpass'; bp.Q.value=5;
    bp.frequency.setValueAtTime(180,t); bp.frequency.exponentialRampToValueAtTime(2200,ti-.05);
    rgn.gain.setValueAtTime(.0001,t); rgn.gain.exponentialRampToValueAtTime(.2,ti-.1); rgn.gain.exponentialRampToValueAtTime(.0001,ti-.02);
    rn.connect(bp); bp.connect(rgn); rgn.connect(out); rn.start(t); rn.stop(ti);
    // 3) lamento agudo dissonante (segunda menor subindo)
    [[311,330],[466,494]].forEach(([f1,f2],i)=>{
      [f1,f2].forEach((fr,k)=>{ const o=c.createOscillator(), g=c.createGain(); o.type='sine';
        o.frequency.setValueAtTime(fr*.5,t+1.0); o.frequency.exponentialRampToValueAtTime(fr,ti-.1);
        g.gain.setValueAtTime(.0001,t+1.0); g.gain.exponentialRampToValueAtTime(.03,ti-.15); g.gain.exponentialRampToValueAtTime(.0001,ti-.02);
        o.connect(g); g.connect(out); o.start(t+1.0); o.stop(ti); });
    });
    // 4) batimentos de coração que aceleram
    [.25,.9,1.45,1.9,2.25,2.52,2.72,2.86,2.95].forEach((dt,i)=>{
      const o=c.createOscillator(), g=c.createGain(), at=t+dt; o.type='sine';
      o.frequency.setValueAtTime(85,at); o.frequency.exponentialRampToValueAtTime(30,at+.18);
      env(g,at,.4+i*.08,.006,.26); o.connect(g); g.connect(out); o.start(at); o.stop(at+.3);
    });
    // 5) sino metálico sombrio em cada palavra
    [.3,1.05,1.8,2.45].forEach((dt,i)=>{
      [[1,.12],[2.76,.04],[5.4,.012]].forEach(([m,vol])=>{
        const o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=(88-i*5)*m;
        env(g,t+dt,vol,.004,1.1); o.connect(g); g.connect(out); o.start(t+dt); o.stop(t+dt+1.3); });
    });
    // 6) IMPACTO: sub-grave + golpe distorcido + cluster dissonante + brilho gélido
    const bo=c.createOscillator(), bog=c.createGain(); bo.type='sine';
    bo.frequency.setValueAtTime(115,ti); bo.frequency.exponentialRampToValueAtTime(26,ti+1.5);
    env(bog,ti,1.0,.006,2.3); bo.connect(bog); bog.connect(out); bo.start(ti); bo.stop(ti+2.8);
    // cópia levemente saturada: gera harmônicos que o alto-falante do celular consegue reproduzir
    const bs=c.createOscillator(), bsw=c.createWaveShaper(), bsg=c.createGain(); bs.type='sine'; bsw.curve=curve(14);
    bs.frequency.setValueAtTime(115,ti); bs.frequency.exponentialRampToValueAtTime(30,ti+1.2); env(bsg,ti,.5,.006,1.6);
    bs.connect(bsw); bsw.connect(bsg); bsg.connect(out); bs.start(ti); bs.stop(ti+2);
    const hit=c.createBufferSource(); hit.buffer=noise(.7); const ws=c.createWaveShaper(); ws.curve=curve(60);
    const hf=c.createBiquadFilter(), hg=c.createGain(); hf.type='lowpass'; hf.frequency.setValueAtTime(2600,ti); hf.frequency.exponentialRampToValueAtTime(160,ti+.8);
    env(hg,ti,.5,.003,.6); hit.connect(ws); ws.connect(hf); hf.connect(hg); hg.connect(out); hit.start(ti);
    const cl=c.createBiquadFilter(); cl.type='lowpass'; cl.frequency.setValueAtTime(900,ti); cl.frequency.exponentialRampToValueAtTime(140,ti+2.2); cl.connect(out);
    [41.2,43.65,58.3,61.7].forEach((fr,i)=>{ const o=c.createOscillator(), g=c.createGain(); o.type='sawtooth'; o.frequency.value=fr; o.detune.value=(i%2?7:-7);
      env(g,ti,.2,.01,2.6); o.connect(g); g.connect(cl); o.start(ti); o.stop(ti+2.5); });
    [1046.5,1108.7].forEach(fr=>{ const o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=fr;
      env(g,ti+.02,.014,.01,2.4); o.connect(g); g.connect(out); o.start(ti+.02); o.stop(ti+2.6); });
  }

  const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
  let started=false, finished=false, fired=false, wi=-1, raf=0;
  function end(skip){
    if(finished) return; finished=true; cancelAnimationFrame(raf);
    try{ if(skip&&master){ master.gain.cancelScheduledValues(AC.currentTime); master.gain.setTargetAtTime(0,AC.currentTime,.05);} }catch(e){}
    intro.classList.add('out'); setTimeout(()=>intro.remove(),800);
  }
  function fire(){
    fired=true; svg.classList.add('fire');
    const r=svg.getBoundingClientRect(); rip.style.left=(r.left+r.width/2)+'px'; rip.style.top=(r.top+r.height/2)+'px'; rip.classList.add('go');
    iw.className=''; void iw.offsetWidth; iw.textContent='Mapa Mental Executivo'; iw.className='fin';
    dots.forEach(d=>{d.style.opacity=1;});
  }
  function begin(){
    if(started) return; started=true; tap.style.display='none';
    sfx(); const t0=performance.now();
    function frame(now){
      const t=now-t0;
      const dp=Math.min(t/1000,1), e1=ease(dp);
      outs.forEach(o=>o.style.strokeDashoffset=1-e1);
      const fp=Math.min(Math.max((t-500)/2500,0),1), ef=ease(fp);
      rect.setAttribute('y',312-300*ef);
      const lit=Math.floor(fp*dots.length);
      dots.forEach((d,i)=>{ if(i<lit){ const ph=(t/160+i)%2; d.style.opacity=fired?1:(.45+.55*Math.abs(Math.sin(ph*1.57))); } });
      const pct=Math.round(Math.min(t/IMPACT,1)*100); bar.style.width=pct+'%'; pc.textContent=fired?'ATIVADO':'ATIVANDO '+pct+'%';
      if(!fired){
        for(let i=WORDS.length-1;i>=0;i--){ if(t>=WORDS[i][0]){ if(wi!==i){ wi=i; iw.className=''; void iw.offsetWidth; iw.textContent=WORDS[i][1]; iw.className='pop'; } break; } }
        if(t>=IMPACT) fire();
      }
      if(t>=IMPACT+HOLD){ end(false); return; }
      raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
  }
  intro.addEventListener('pointerdown',()=>{ if(!started){ (AC&&AC.state!=='running'?AC.resume():Promise.resolve()).catch(()=>{}).then(begin); } else end(true); });
  // se o navegador liberar o som sozinho, começa direto; senão pede um toque (necessário para tocar o som)
  if(!AC || AC.state==='running') begin();
  else { outs.forEach(o=>o.style.strokeDashoffset=.55); tap.style.display='block'; }
})();
</script>
